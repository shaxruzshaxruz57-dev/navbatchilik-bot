name: Navbatchilik bot

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Workflowni faol saqlash (60 kundan keyin o'chib qolmasligi uchun)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT repos/${{ github.repository }}/actions/workflows/main.yml/enable || true

      - name: Repositoryni yuklash
        uses: actions/checkout@v5

      - name: Python o‘rnatish
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Kerakli kutubxonalarni o‘rnatish
        run: |
          pip install gspread google-auth python-telegram-bot

      - name: Google JSON faylini yaratish
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          printf '%s' "$GOOGLE_CREDENTIALS" > navbatchilik-bot-a1500f896dd8.json

      - name: Botni ishga tushirish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python bot.py
